# Paper-default configuration.
#
# Values match the paper where it is explicit: 80/20 split, 3-fold
# cross-validation inside the training portion, 30 epochs, batch size 16,
# Adam with lr 1e-4 and no weight decay, classification loss plus a 0.01
# contrastive term, and Accuracy/Precision/Recall/F1/AUC.
#
# Unspecified details (AAindex table, pooling, fusion details, seeds) are
# implementation assumptions documented in docs/reproducibility.md.

run:
  name: deephvi
  seed: 42
  deterministic: true
  device: auto

# Optional public galleries for subsequent retrieval; no additional training loss.
# Set sources to [human, viral] or pass --reference-source both.
references:
  sources: []
  dir: data/reference
  overwrite: false

data:
  pairs: null
  max_seq_len: 1024
  esm:
    backend: esm2
    model: esm2
    pooling: masked_mean
    max_length: 1024
    batch_size: 8
    local_files_only: true
  negatives:
    ratio: 0.5
    strategy: random
    seed: 42
  splits:
    protocol: paper
    n_folds: 3
    test_fraction: 0.2
    seed: 42

model:
  name: deephvi
  dropout: 0.2
  fusion:
    embedding_mode: mean_poe
    sample_latent_train: true
    sample_latent_eval: false

loss:
  contrastive_weight: 0.01
  classifier_recon_weight: 0.0

train_pretrain:
  epochs: 10
  batch_size: 16
  lr: 1.0e-4
  weight_decay: 0.0
  monitor: val_loss

train_classifier:
  epochs: 30
  batch_size: 16
  lr: 1.0e-4
  encoder_lr_scale: 0.1
  weight_decay: 0.0
  monitor: val_auc
  drop_last_train: true

eval:
  split: test
  metrics: [accuracy, precision, recall, f1, roc_auc]
  average: macro
  threshold: 0.5
