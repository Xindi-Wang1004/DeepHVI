name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      UV_PYTHON: ${{ matrix.python }}
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and locked dependencies
        run: |
          uv python install "$UV_PYTHON"
          uv sync --frozen --python "$UV_PYTHON" --extra data --extra dev
      - name: Check public repository contents
        run: uv run --frozen python scripts/check_public_tree.py
      - name: Lint
        run: uv run --frozen ruff check src tests scripts
      - name: Unit and integration tests
        run: uv run --frozen pytest -q

  release-acceptance:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify public snapshot and installed wheel with real resources
        run: python3 scripts/verify_release.py --python 3.12
