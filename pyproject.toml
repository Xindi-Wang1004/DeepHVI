[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deephvi"
version = "0.1.0"
description = "Reproducible reference implementation of DeepHVI for human-virus protein-protein interaction prediction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["protein-protein interaction", "ESM-2", "multimodal", "deep learning", "virology"]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "torch>=2.2",
    "transformers>=4.36",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
data = ["py7zr>=0.20"]

[project.scripts]
deephvi = "deephvi.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/deephvi"]

# An explicit sdist allowlist prevents local research artifacts from leaking
# even when building outside a Git checkout.
[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/configs", "/docs",
    "/.github", "/README.md", "/README.zh-CN.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/THIRD_PARTY_NOTICES.zh-CN.md",
    "/pyproject.toml", "/uv.lock", "/.gitignore", "/.gitattributes",
    "/data/README.md", "/data/README.zh-CN.md", "/data/readme.txt",
    "/data/manifest.json", "/data/SHA256SUMS", "/data/PACKAGES.json", "/data/PACKAGES.sha256",
]

exclude = [
    "**/dev-docs/**", "**/dev-files/**", "**/internal/**",
    "**/AGENTS.md", "**/AGENTS.*.md", "**/CLAUDE.md", "**/GEMINI.md",
    "**/NOTES.md", "**/PLAN.md", "**/TODO.md", "**/REVIEW.md", "**/WORKLOG.md",
    "**/*.local.md", "**/*.draft.md", "**/.agents/**", "**/.claude/**", "**/.codex/**",
    "**/*.log", "**/*.tmp", "**/*.bak", "**/*.orig", "**/*.rej",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end CPU smoke tests",
    "esm: tests that require local ESM-2 weights",
]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

# Use CPU-only PyTorch by default. GPU users can remove this block and
# install the CUDA build matching their driver.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
